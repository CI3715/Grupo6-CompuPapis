services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: cuentas_claras
      POSTGRES_PASSWORD: cuentas_claras_local
      POSTGRES_DB: cuentas_claras
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - cuentas_claras_postgres:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuentas_claras -d cuentas_claras"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  cuentas_claras_postgres:
